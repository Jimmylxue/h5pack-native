<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hello h5pack</title>
  </head>
  <style>
    #cameraPreview {
      width: 100px;
    }
  </style>
  <body>
    <h1>hello h5pack</h1>

    <h3>相机模块</h3>
    <button onclick="checkPermission()">查看权限</button>
    <button onclick="requestCameraPermission()">申请相机权限</button>
    <button onclick="openCamera()">跳转相机</button>
    <button onclick="chooseImage()">打开相册</button>
    <button onclick="scan()">扫码</button>

    <img id="cameraPreview" alt="" />

    <div>扫码结果：<span id="scanRes"></span></div>

    <h3>位置模块</h3>
    <div>
      <button onclick="checkLocationPermission()">检查定位权限</button>
      <button onclick="requestLocationPermission()">申请定位权限</button>
      <button onclick="checkLocationEnabled()">检查定位服务</button>
      <button onclick="getCurrentPosition()">获取当前位置</button>
      <button onclick="openLocationSettings()">打开定位设置</button>
      <button onclick="openAppSettings()">打开应用设置</button>
      <div id="position" style="margin-top:8px;word-break:break-all;"></div>
    </div>

    <h3>录音模块</h3>
    <div>
      <button onclick="startRecordAudio()">开始录音</button>
      <button onclick="stopRecordAudio()">停止录音</button>
      <button onclick="cancelRecordAudio()">取消录音</button>
      <button onclick="restartRecordAudio()">重新录音</button>
      <button onclick="playRecordAudio()">▶ 播放</button>
      <button onclick="stopPlayRecordAudio()">⏹ 停止播放</button>
      <div id="recordAudioRes"></div>
      <div id="playbackStatus"></div>
    </div>

    <h3>APP模块</h3>
    <div>
      <button onclick="exitApp()">退出APP</button>
      <button onclick="relaunchApp()">重新打开APP</button>
      <button onclick="refreshApp()">刷新APP</button>
    </div>

    <script src="./vconsole.js"></script>

    <script>
      new VConsole();
    </script>

    <script src="./assets/h5pack-bridge.min.js"></script>

    <script>
      function checkPermission() {
        h5packBridge.camera.checkPermission().then(res => {
          console.log('res', res);
          alert(`权限结果：${res ? '有' : '无'}`);
        });
      }

      function requestCameraPermission() {
        h5packBridge.camera.requestPermission().then(res => {
          console.log('申请res', res);
        });
      }

      function openCamera() {
        h5packBridge.camera.open().then(res => {
          console.log('拍照res', res);
          document.getElementById('cameraPreview').src = res?.base64;
        });
      }

      function chooseImage() {
        h5packBridge.camera.chooseImage().then(res => {
          console.log('拍照res', res);
          document.getElementById('cameraPreview').src = res[1]?.base64;
        });
      }

      function scan() {
        h5packBridge.camera.scan().then(res => {
          document.getElementById('scanRes').textContent = res;
        });
      }

      function checkLocationPermission() {
        h5packBridge.location.checkPermission().then(granted => {
          console.log('定位权限', granted);
          alert(`定位权限：${granted ? '已授权' : '未授权'}`);
        });
      }

      function requestLocationPermission() {
        h5packBridge.location.requestPermission().then(res => {
          console.log('申请定位权限', res);
          alert(`结果：${JSON.stringify(res)}`);
        });
      }

      function checkLocationEnabled() {
        h5packBridge.location.checkLocationEnabled().then(enabled => {
          console.log('定位服务', enabled);
          alert(`定位服务：${enabled ? '已开启' : '未开启'}`);
        });
      }

      function getCurrentPosition() {
        h5packBridge.location.getCurrentPosition().then(res => {
          console.log('地址res', res);
          document.getElementById('position').textContent = JSON.stringify(res);
        }).catch(err => {
          console.error('定位失败', err);
          document.getElementById('position').textContent = `错误：${err.code} - ${err.message}`;
          if (err.code === 'LOCATION_PERMISSION_NEVER_ASK_AGAIN') {
            if (confirm('定位权限被永久拒绝，是否打开应用设置页？')) {
              h5packBridge.location.openAppSettings();
            }
          } else if (err.code === 'LOCATION_SERVICES_DISABLED') {
            if (confirm('定位服务未开启，是否打开定位设置？')) {
              h5packBridge.location.openLocationSettings();
            }
          }
        });
      }

      function openLocationSettings() {
        h5packBridge.location.openLocationSettings();
      }

      function openAppSettings() {
        h5packBridge.location.openAppSettings();
      }

      var currentRecordPath = '';

      function startRecordAudio() {
        h5packBridge.recordAudio.start().then(res => {
          console.log('开始录音res', res);
          document.getElementById('recordAudioRes').textContent = '录音中...';
        });
      }

      function stopRecordAudio() {
        h5packBridge.recordAudio.stop().then(res => {
          console.log('停止录音res', res);
          currentRecordPath = res.path;
          document.getElementById('recordAudioRes').textContent =
            `录音完成：${res.durationMs}ms\n路径：${res.path}`;
        });
      }

      function cancelRecordAudio() {
        h5packBridge.recordAudio.cancel().then(() => {
          currentRecordPath = '';
          document.getElementById('recordAudioRes').textContent = '录音已取消';
        });
      }

      function restartRecordAudio() {
        h5packBridge.recordAudio.restart().then(res => {
          console.log('重新录音res', res);
          document.getElementById('recordAudioRes').textContent = '重新录音中...';
        });
      }

      function playRecordAudio() {
        if (!currentRecordPath) {
          alert('请先录音');
          return;
        }
        h5packBridge.recordAudio.play(currentRecordPath).then(() => {
          console.log('播放中', currentRecordPath);
          document.getElementById('playbackStatus').textContent =
            '正在播放：' + currentRecordPath;
        });
      }

      function stopPlayRecordAudio() {
        h5packBridge.recordAudio.stopPlay().then(() => {
          console.log('停止播放');
          document.getElementById('playbackStatus').textContent = '播放已停止';
        });
      }

      function exitApp() {
        h5packBridge.app
          .exit({
            confirm: true,
            title: '退出APP',
          })
          .then(res => {
            console.log('退出APPres', res);
          });
      }

      function relaunchApp() {
        h5packBridge.app
          .relaunch({
            confirm: true,
          })
          .then(res => {
            console.log('重新打开APPres', res);
          });
      }

      function refreshApp() {
        h5packBridge.app
          .refresh({
            confirm: true,
            title: '刷新APP',
          })
          .then(res => {
            console.log('刷新APPres', res);
          });
      }
    </script>

    <video src="" autoplay></video>
  </body>
</html>
